nt-size:11px;font-weight:bold}.status{padding:12px;border-radius:8px;margin:8px 0;font-size:14px;font-weight:bold}.tagUp{background:#ff3b30;color:#fff;padding:2px 6px;border-radius:5px;font-size:11px;font-weight:bold}.tagNet{background:#2196F3;color:#fff;padding:2px 6px;border-radius:5px;font-size:11px;font-weight:bold}</style>
<script>
var pickedCover=''; var pickedAudio=''; var pickedAudioName='';
var mine=[]; var saved=[]; var earn={streams:0,downloads:0,dlPer:{}}; var list=[]; var netList=[]; var mode='local'; var curFilter='ALL';
function go(p){
  var pages=['home','search','library','upload','earnings','profile','admin'];
  for(var i=0;i<pages.length;i++){var el=document.getElementById('page-'+pages[i]); if(el) el.style.display='none';}
  var t=document.getElementById('page-'+p); if(t) t.style.display='block';
  var navs=['home','search','library','upload','earnings','profile'];
  for(var j=0;j<navs.length;j++){var b=document.getElementById('nav-'+navs[j]); if(b) b.className=(navs[j]==p?'active':'');}
  window.scrollTo(0,0);
  try{ if(p=='upload') showMine(); }catch(e){}
  try{ if(p=='earnings') showEarn(); }catch(e){}
  try{ if(p=='profile') showProfile(); }catch(e){}
  try{ if(p=='home'||p=='search') renderAll(); }catch(e){}
  try{ if(p=='admin') showAdmin(); }catch(e){}
  try{ if(p=='library') showLib(); }catch(e){}
}
function pickCover(input){ var f=input.files[0]; if(!f) return; var url=URL.createObjectURL(f); pickedCover=url; var img=document.getElementById('coverPrev'); img.src=url; img.style.display='block'; document.getElementById('coverMsg').innerHTML='✅ COVER: '+f.name; var cs=document.getElementById('coverStatus'); cs.innerHTML='✅ Cover loaded!'; cs.style.background='#1db954'; }
function pickAudio(input){ var f=input.files[0]; if(!f) return; pickedAudio=URL.createObjectURL(f); pickedAudioName=f.name; document.getElementById('audioMsg').innerHTML='✅ AUDIO: '+f.name; var as=document.getElementById('audioStatus'); as.innerHTML='✅ Song ready! Press PUBLISH.'; as.style.background='#1db954'; var tEl=document.getElementById('t'); if(tEl && !tEl.value){ tEl.value=f.name.replace('.mp3','').replace('.MP3','').trim(); } }
function playSong(i,from){
  var s = from=='net' ? netList[i] : from=='lib' ? saved[i] : mine[i];
  if(!s || !s.audio){ alert('No audio. Internet needs internet. Uploaded needs re-upload after refresh.'); return; }
  var au=document.getElementById('au'); au.pause(); au.src=s.audio; au.currentTime=0;
  document.getElementById('player').style.display='block';
  document.getElementById('pt').innerText=s.title;
  document.getElementById('pa').innerText=s.artist+' • '+(s.city||'')+' '+(s.country||'');
  document.getElementById('pImg').src=s.cover||'https://via.placeholder.com/55';
  document.getElementById('pStatus').innerText = from=='net' ? '🌍 INTERNET - 30 sec preview' : '⬆️ UPLOADED - Vixxon Artist';
  au.play(); earn.streams++; try{showEarn();}catch(e){}
}
function togglePlay(){ var au=document.getElementById('au'); if(au.paused){au.play(); document.getElementById('pStatus').innerText='▶ Now Playing';} else {au.pause(); document.getElementById('pStatus').innerText='⏸ Paused';} }
function closePlayer(){ var au=document.getElementById('au'); au.pause(); au.src=''; document.getElementById('player').style.display='none'; }
function up(){
  var st=document.getElementById('upStatus'); st.style.background='#FF9800'; st.innerHTML='⏳ Publishing...';
  setTimeout(function(){
    try{
      var t=document.getElementById('t').value.trim(); var a=document.getElementById('a').value.trim(); var country=document.getElementById('country').value; var city=document.getElementById('city').value.trim(); var wa=document.getElementById('wa').value.trim(); var m=document.getElementById('momo').value.trim(); var g=document.getElementById('g').value;
      if(!t && pickedAudioName){ t=pickedAudioName.replace('.mp3','').replace('.MP3','').trim(); }
      if(!t) t='How I Feel'; if(!a) a='Vixxon Kalema'; if(!city) city='BUGIRI'; if(!wa) wa='256705570948'; if(!m) m=wa;
      if(!pickedAudio){ st.style.background='#ff3b30'; st.innerHTML='❌ No MP3! Choose MP3 first'; return; }
      var cover=pickedCover||'https://via.placeholder.com/150/ff3b30/fff?text='+encodeURIComponent(t.charAt(0));
      var newSong={title:t,artist:a,genre:g,cover:cover,audio:pickedAudio,audioName:pickedAudioName,wa:wa,momo:m,country:country,city:city,isUploaded:true};
      mine.unshift(newSong);
      var already=false; for(var k=0;k<saved.length;k++){ if(saved[k].title==t && saved[k].artist==a) already=true; }
      if(!already) saved.unshift(newSong);
      st.style.background='#1db954'; st.innerHTML='✅ PUBLISHED! '+t+' - Now in HOME + LIBRARY ONLY!';
      try{showMine();}catch(e){} try{renderAll();}catch(e){} try{showLib();}catch(e){}
      pickedCover=''; pickedAudio=''; pickedAudioName='';
      try{document.getElementById('coverPrev').style.display='none'; document.getElementById('coverFile').value=''; document.getElementById('f').value='';}catch(e){}
      alert('✅ SUCCESS! '+t+' is now in HOME + LIBRARY.');
      go('library');
    }catch(err){ st.style.background='#ff3b30'; st.innerHTML='❌ Error: '+err.message; }
  },50);
}
function showMine(){ var h=''; for(var i=0;i<mine.length;i++){ h+=cardUploaded(mine[i],i,'mine'); } var el=document.getElementById('myList'); if(el) el.innerHTML=h||'<p>No uploads yet.</p>'; }
function flagFor(c){var m={'Uganda':'🇺🇬','Nigeria':'🇳🇬','Kenya':'🇰🇪','Tanzania':'🇹🇿','Ghana':'🇬🇭','South Africa':'🇿🇦','Ethiopia':'🇪🇹','USA':'🇺🇸','UK':'🇬🇧','Canada':'🇨🇦','Brazil':'🇧🇷','India':'🇮🇳','France':'🇫🇷','Germany':'🇩🇪'};return m[c]||'🌍';}
function regionFor(c){if(['Uganda','Nigeria','Kenya','Tanzania','Ghana','South Africa','Ethiopia'].indexOf(c)>-1)return 'Africa';if(['USA','Canada','Brazil'].indexOf(c)>-1)return 'Americas';if(['UK','France','Germany'].indexOf(c)>-1)return 'Europe';if(['India'].indexOf(c)>-1)return 'Asia';return 'Other';}
function cardUploaded(s,i,from){
  var dl=(earn.dlPer[s.title+' - '+s.artist]||0);
  var saveBtn = from=='lib' ? '' : '<button class="mini dark" onclick="event.stopPropagation();saveUploaded('+i+')">❤️ Save</button>';
  var bookBtn = s.wa ? '<button class="mini gold" onclick="event.stopPropagation();bookArtist(\''+s.wa+'\')">📞 Book</button>' : '';
  return '<div class="card" onclick="playSong('+i+',\''+from+'\')"><img src="'+(s.cover||'https://via.placeholder.com/60')+'"><div style="flex:1"><span class="tagUp">⬆️ UPLOADED</span> <b>'+s.title+'</b> <span class="badge">
