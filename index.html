<body>
<div id="home">

["music","🎵 Music","<h2>🎵 Music</h2><div class='card'><h3>Top Songs from Busowa</h3><p>1. Wicky Anthem - Vixxon<br>2. From Busowa to the World<br>3. Dream Big</p><button onclick=\"alert('🎵 Playing Wicky Anthem... Turn up volume!')\">▶ Play Wicky Anthem</button><button onclick=\"alert('🎵 Playing Dream Big...')\">▶ Play Dream Big</button><p id='m'></p></div>"],
["videos","🎬 Videos","<h2>🎬 Videos</h2><div class='card'><p>Watch Wicky AI Videos:</p><button onclick=\"alert('🎬 Opening Video: How I Built Wicky AI')\">▶ How I Built Wicky AI</button><br><button onclick=\"alert('🎬 Opening Video: Busowa Tour')\">▶ Busowa Tour</button><br><button onclick=\"alert('🎬 Opening Video: My Music')\">▶ My Music</button></div>"],

["farming","🌾 Farming","<h2>🌾 Farming</h2><div class='card'><h3>Maize Calculator</h3>How many acres?<input id='ac' type='number' value='1'><button onclick=\"document.getElementById('fr').innerText='You need '+document.getElementById('ac').value*10+'kg of seeds. Expected harvest: '+document.getElementById('ac').value*800+'kg!'\">Calculate</button><p id='fr'></p><p>Tip: Space 75cm x 30cm. Use manure.</p></div>"],
["health","🏥 Health","<h2>🏥 Health</h2><div class='card'><p>How do you feel?</p><button onclick=\"alert('Drink clean water, rest, eat fruits. If fever > 2 days, go to health centre!')\">🤒 Fever</button><button onclick=\"alert('Drink water, rest in dark room.')\">🤕 Headache</button><button onclick=\"alert('Eat oranges, drink water, rest.')\">🤧 Flu</button><p>Always tell a trusted adult if sick!</p></div>"],
["edu","📚 Education","<h2>📚 Education</h2><div class='card'><h3>Maths: 7 x 8 = ?</h3><button onclick=\"quiz(this,1)\">56</button><button onclick=\"quiz(this,0)\">54</button><button onclick=\"quiz(this,0)\">48</button><p id='qr'>Pick answer! Score: <span id='sc'>0</span></p></div><div class='card'><b>Luganda:</b><br>Oli otya = How are you?<br>Webale = Thank you<br>Essomero = School</div>"],
["business","💼 Business","<h2>💼 Business</h2><div class='card'><h3>Profit Calculator</h3>Selling Price<input id='sp' type='number' value='5000'>Cost Price<input id='cp' type='number' value='3000'><button onclick=\"document.getElementById('pr').innerText='Profit = '+(document.getElementById('sp').value-document.getElementById('cp').value)+' UGX. Good business!'\">Calculate Profit</button><p id='pr'></p></div>"],
["games","🎮 Games","<h2>🎮 Games</h2><div class='card'><h3>Guess Number 1-10</h3><input id='g' type='number'><button onclick=\"guess()\">Guess!</button><p id='gr'>I am thinking...</p></div><div class='card'><h3>Rock Paper Scissors</h3><button onclick=\"rps('Rock')\">✊ Rock</button><button onclick=\"rps('Paper')\">✋ Paper</button><button onclick=\"rps('Scissors')\">✌️ Scissors</button><p id='rp'></p></div>"],
["prayer","🙏 Prayer","<h2>🙏 Prayer</h2><div class='card'><button onclick=\"document.getElementById('pr2').innerText='Lord, bless my day, my family, Busowa and Uganda. Give me wisdom to build great things. Amen.'\">🙏 Get Today's Prayer</button><p id='pr2'></p><p>• Morning Prayer<br>• Thanks Prayer<br>• Night Prayer</p></div>"],
["shop","🛍️ Shop","<h2>🛍️ Shop</h2><div class='card'><p>Wicky Shop:</p><button onclick=\"addShop('Wicky T-Shirt - 20000')\">👕 T-Shirt - 20,000</button><br><button onclick=\"addShop('Wicky Cap - 15000')\">🧢 Cap - 15,000</button><br><button onclick=\"addShop('Wicky Hoodie - 35000')\">🧥 Hoodie - 35,000</button><p id='cart'>Cart: Empty</p></div>"],
["chat","💬 Chat","<h2>💬 Chat</h2><p>Ask in Luganda or English!</p><textarea id='q' placeholder='Ask Wicky AI...'></textarea><br><button onclick=\"ask()\">Ask Wicky AI</button><p id='a' style='text-align:left;background:#08331f;padding:12px;border-radius:10px'>Wicky AI: Oli otya?</p>"],
["love","❤️ Love","<h2>❤️ Love</h2><div class='card'>Your Name<input id='n1'>Crush Name<input id='n2'><button onclick=\"document.getElementById('lv').innerText='❤️ '+document.getElementById('n1').value+' + '+document.getElementById('n2').value+' = '+Math.floor(Math.random()*40+60)+'% Love! True love is kindness and respect!'\">Check Love %</button><p id='lv'></p></div>"],
["sports","⚽ Sports","<h2>⚽ Sports</h2><div class='card'><p>Uganda Cranes vs Kenya: 2-1 🎉<br>Arsenal vs Chelsea: 1-1<br>Man Utd vs Liverpool: 2-0</p><button onclick=\"alert('⚽ GOAL! Wicky scores for Busowa!')\">⚽ Score a Goal!</button></div>"],
["weather","🌦️ Weather","<h2>🌦️ Weather</h2><div class='card'><button onclick=\"document.getElementById('w').innerText='🌦️ Kampala Today: 26°C, Rain in afternoon. Carry umbrella! Busowa: Sunny morning.'\">Check Kampala Weather</button><p id='w'></p></div>"],
["jokes","😂 Jokes","<h2>😂 Jokes</h2><div class='card'><button onclick=\"joke()\">😂 Tell Me a Joke</button><p id='jk'>Tap button...</p></div>"],
["cooking","🍳 Cooking","<h2>🍳 Cooking</h2><div class='card'><h3>Rolex Recipe:</h3><p>1. Fry eggs + cabbage<br>2. Put on chapati<br>3. Roll it. Enjoy!<br>Cost: ~3000 UGX</p><button onclick=\"alert('🍳 Rolex ready! Enjoy!')\">I Made Rolex!</button></div>"],
["transport","🛵 Transport","<h2>🛵 Transport</h2><div class='card'>From<input id='from' value='Busowa'>To<input id='to' value='Kampala'>KM<input id='km' type='number' value='20'><button onclick=\"document.getElementById('tf').innerText='Boda fare: ~ '+(document.getElementById('km').value*1000)+' UGX. Taxi: ~ '+(document.getElementById('km').value*500)+' UGX.'\">Calculate Fare</button><p id='tf'></p></div>"],
["jobs","💼 Jobs","<h2>💼 Jobs</h2><div class='card'><p>Job Ideas for Youth:<br>• Boda Rider<br>• Phone Repair<br>• Farming<br>• Content Creator<br>• Shop Keeper<br>• Coding - Like Wicky!</p><button onclick=\"alert('💼 Tip: Learn a skill, be honest, work hard!')\">Get Job Tip</button></div>"],
["tech","📱 Tech","<h2>📱 Tech</h2><div class='card'><p>Tech Tips:<br>• Save battery: Lower brightness<br>• Free storage: Delete old videos<br>• Stay safe: Never share password!</p><button onclick=\"alert('📱 You can learn coding FREE on your phone! Like Wicky did!')\">Learn Coding Tip</button></div>"],
["art","🎨 Art","<h2>🎨 Art</h2><div class='card'><p>Pick a Colour:</p><input type='color' id='col' onchange=\"document.body.style.background=this.value\"><p>Change background colour of site! Try it!</p><button onclick=\"document.body.style.background='#0b4d2e'\">Reset Green</button></div>"],
["history","📜 History","<h2>📜 History</h2><div class='card'><p>Uganda Facts:<br>• Capital: Kampala<br>• Independence: 9 Oct 1962<br>• Pearl of Africa<br>• Busowa is in Bugiri District!</p><button onclick=\"alert('📜 Uganda got independence in 1962!')\">More Facts</button></div>"],
["science","🔬 Science","<h2>🔬 Science</h2><div class='card'><button onclick=\"sci()\">🔬 Random Science Fact</button><p id='sc2'>Tap...</p></div>"],
["motivation","💪 Motivation","<h2>💪 Motivation</h2><div class='card'><button onclick=\"mot()\">💪 Motivate Me!</button><p id='mo'>Tap...</p></div>"],
["bible","📖 Bible","<h2>📖 Bible</h2><div class='card'><button onclick=\"document.getElementById('bv').innerText='📖 I can do all things through Christ who strengthens me. - Philippians 4:13'\">📖 Get Verse</button><p id='bv'></p></div>"],
["money","💰 Money","<h2>💰 Money</h2><div class='card'>Save per week<input id='sv' type='number' value='5000'><button onclick=\"document.getElementById('mn').innerText='In 1 year you will save '+(document.getElementById('sv').value*52)+' UGX! Keep saving!'\">Calculate Savings</button><p id='mn'></p></div>"]
];
let secret=Math.floor(Math.random()*10)+1, score=0, cart=[];
let menu=document.getElementById('menu');
chambers.forEach(c=>{let d=document.createElement('div');d.className='chamber';d.innerHTML=c[1];d.onclick=()=>openC(c[0]);menu.appendChild(d)});
function openC(id){let c=chambers.find(x=>x[0]==id);document.getElementById('home').classList.add('hidden');document.getElementById('page').classList.remove('hidden');document.getElementById('content').innerHTML=c[2];window.scrollTo(0,0)}
function goHome(){document.getElementById('page').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}
function guess(){let g=document.getElementById('g').value;if(g==secret){document.getElementById('gr').innerText='🎉 CORRECT! New number!';secret=Math.floor(Math.random()*10)+1}else if(g<secret)document.getElementById('gr').innerText='Too small! Go bigger ⬆️';else document.getElementById('gr').innerText='Too big! Go smaller ⬇️'}
function rps(u){let c=['Rock','Paper','Scissors'][Math.floor(Math.random()*3)];let r=u==c?'Draw! Both '+c:(u=='Rock'&&c=='Scissors')||(u=='Paper'&&c=='Rock')||(u=='Scissors'&&c=='Paper')?'🎉 YOU WIN! You:'+u+' Wicky:'+c:'Wicky Wins! You:'+u+' Wicky:'+c;document.getElementById('rp').innerText=r}
function ask(){let q=document.getElementById('q').value.toLowerCase();let a='';if(q.includes('oli otya')||q.includes('how are you'))a='Bulungi nyo! Ndi bulungi! Oli otya naawe?';else if(q.includes('maize')||q.includes('kasooli'))a='For maize: Plant at start of rains, space 75cm x 30cm, use manure. Harvest in 3 months!';else if(q.includes('school')||q.includes('study'))a='Study 30 mins daily, ask teacher questions, never give up! You are smart!';else if(q.includes('who')&&q.includes('built'))a='I was built by Kalema Wyclif from Busowa! Best developer!';else if(q.includes('hello')||q.includes('hi'))a='Hello! Oli otya? I am Wicky AI. How can I help?';else a='Great question! '+document.getElementById('q').value+' - Keep dreaming big. From Busowa to the World!';document.getElementById('a').innerText='Wicky AI: '+a}
function quiz(el,ok){if(ok){score++;document.getElementById('qr').innerHTML='✅ CORRECT! Score: <span>'+score+'</span>'}else document.getElementById('qr').innerText='❌ Try again! Hint: 7x7=49'}
function addShop(i){cart.push(i);document.getElementById('cart').innerText='Cart: '+cart.join(', ')}
function joke(){let j=['Why did chicken cross road? To get to Busowa!','What do you call a smart boda? A Wicky Boda!','Why is maize funny? Because it is corny!','Knock knock... Who is there? Wicky! Wicky who? Wicky AI from Busowa!'];document.getElementById('jk').innerText=j[Math.floor(Math.random()*j.length)]}
function sci(){let s=['Water is H2O','Plants make food from sun','Earth goes around Sun','Humans have 206 bones'];document.getElementById('sc2').innerText=s[Math.floor(Math.random()*s.length)]}
function mot(){let m=['From Busowa to the World! You can do it!','Dream Big! Work Hard! Never Give Up!','Kalema built a website - So can you!','Every big developer started small!'];document.getElementById('mo').innerText=m[Math.floor(Math.random()*m.length)]}
</script>
