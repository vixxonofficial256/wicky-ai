<style>
body{background:#111;color:#fff;font-family:Arial;margin:0;padding-bottom:160px}
header{background:#7b1fa2;padding:12px;text-align:center}
.page{display:none;padding:12px}.show{display:block}

.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:bold;margin:6px 0;background:#7b1fa2;color:#fff}

.split{font-size:13px;color:#FFC107;font-weight:bold}
.history{font-size:13px;background:#111;padding:8px;border-radius:8px;margin-top:8px}
</style>
<script>

function showAdmin(){ var h=''; for(var i=0;i<subs.length;i++){ var s=subs[i]; h+='<div class="card"><b>'+s.title+'</b> - '+s.artist+'<br>WhatsApp: '+s.wa+' | MoMo: '+s.momo+'<br>Status: <b>'+s.status+'</b><br><button class="btn btnG" onclick="approve('+i+')">✅ APPROVE</button><button class="btn btnR" onclick="reject('+i+')">❌ REJECT</button><button class="btn btnB" onclick="listenSong('+i+')">▶ LISTEN</button></div>'; } document.getElementById('adminList').innerHTML=h||'<p>No submissions yet.</p>'; }
function approve(i){ subs[i].status='APPROVED'; alert('✅ APPROVED - LIVE!'); showAdmin(); showMy(); showEarn(); }
function reject(i){ var r=prompt('Why reject?'); if(r===null) return; subs[i].status='REJECTED'; subs[i].reason=r; showAdmin(); showMy(); }
function listenSong(i){ var s=subs[i]; document.getElementById('adminPlayer').style.display='block'; document.getElementById('adminAudio').src=s.audio; document.getElementById('adminAudio').play(); earn.streams++; showEarn(); }
