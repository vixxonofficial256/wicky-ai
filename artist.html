<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIXXON ARTIST PORTAL - V3.9 - 5 BARS + AUTO SOCIALS</title>
<style>
*{box-sizing:border-box}
body{background:#111;color:#fff;font-family:Arial;margin:0;padding-bottom:115px}
header{background:#7b1fa2;padding:12px;text-align:center}
.page{display:none;padding:12px;min-height:300px}.show{display:block}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0;background:#222;color:#fff}
.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:bold;margin:6px 0;background:#7b1fa2;color:#fff}
.btnG{background:#1db954}.btnR{background:#ff3b30}.btnY{background:#FFC107;color:#000}.btnB{background:#2196F3}.btnP{background:#E91E63}.btnOrange{background:#FF9800}.btnWA{background:#25D366;color:#000}
.card{background:#1e1e1e;padding:12px;border-radius:10px;margin:8px 0}
.box{background:#1e1e1e;padding:12px;border-radius:10px;margin:8px 0}
.badge{padding:3px 8px;border-radius:5px;font-size:12px;font-weight:bold}
.pend{background:#FF9800;color:#000}.appr{background:#1db954}.reje{background:#ff3b30}
.pPic{width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid #7b1fa2;display:block;margin:0 auto}
.cPic{width:150px;height:150px;border-radius:10px;object-fit:cover;display:none;margin:10px auto}
#adminPlayer{position:fixed;bottom:110px;left:0;right:0;background:#222;padding:8px;border-top:3px solid #7b1fa2;z-index:9998;display:none}
#adminPlayer audio{width:100%}
.earnBox{border-left:6px solid #7b1fa2}
.small{font-size:13px;color:#ccc}
.split{font-size:13px;color:#FFC107;font-weight:bold}
.history{font-size:13px;background:#111;padding:8px;border-radius:8px;margin-top:8px}
.chatBox{background:#111;border-radius:10px;padding:10px;min-height:300px;max-height:420px;overflow-y:auto}
.msg{background:#222;padding:10px;border-radius:10px;margin:8px 0}
.msg.me{background:#7b1fa2}
.msgName{font-size:12px;color:#FFC107;font-weight:bold}
.msgTime{font-size:11px;color:#aaa}
.chatInputRow{display:flex;gap:6px;margin-top:8px}
.chatInputRow input{flex:1}
.chatInputRow button{width:70px;padding:12px}
.online{color:#1db954;font-weight:bold}
.socialLink{display:inline-block;background:#333;color:#fff;padding:6px 10px;border-radius:20px;margin:3px;font-size:12px;text-decoration:none;font-weight:bold}
/* 5 SEPARATE BARS AT BOTTOM */
.bottomnav{position:fixed!important;bottom:0!important;left:0!important;right:0!important;display:flex!important;gap:5px!important;padding:8px!important;background:#000!important;z-index:99999!important}
.bottomnav button{flex:1;border:0;border-radius:12px!important;padding:10px 1px!important;font-size:10px!important;font-weight:bold!important;color:#fff!important;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
#btn-profile{background:#7b1fa2}
#btn-upload{background:#1db954}
#btn-earnings{background:#FFC107;color:#000!important}
#btn-chat{background:#2196F3}
#btn-admin{background:#ff3b30}
.bottomnav button.on{outline:3px solid #fff;transform:scale(1.05)}
.ytBtn{background:#FF0000!important}
.ttBtn{background:#000!important;border:1px solid #fff!important}
.autoBadge{background:#1db954;color:#fff;padding:4px 8px;border-radius:5px;font-size:12px;font-weight:bold}
</style>
<script>
var subs=[]; var pic=''; var cover=''; var audio=''; var audioName='';
var earn={downloads:0,streams:0,per:{},votes:0,shoutouts:0,vip:0,bookings:0,promoUntil:'',promoSong:'',bookingList:[],shoutList:[],vipList:[],voteList:[]};
var chatMsgs=[];
try{ var savedChat=localStorage.getItem('vixxon_chat'); if(savedChat) chatMsgs=JSON.parse(savedChat); }catch(e){ chatMsgs=[]; }
if(chatMsgs.length==0){ chatMsgs=[{name:'Vixxon Team',text:'Welcome to Vixxon Artist Chat! Talk to other artists, share tips, collab!',time:'Now',me:false}]; }
function getSocials(){
  return {
    yt: document.getElementById('sYT').value.trim(),
    tt: document.getElementById('sTT').value.trim(),
    ig: document.getElementById('sIG').value.trim(),
    fb: document.getElementById('sFB').value.trim(),
    sp: document.getElementById('sSP').value.trim()
  };
}
function socialHTML(s){
  var h='';
  if(s.yt) h+='<a class="socialLink" style="background:#FF0000" href="'+s.yt+'" target="_blank">▶️ YouTube</a> ';
  if(s.tt) h+='<a class="socialLink" style="background:#000;border:1px solid #fff" href="'+s.tt+'" target="_blank">🎵 TikTok</a> ';
  if(s.ig) h+='<a class="socialLink" style="background:#E1306C" href="'+s.ig+'" target="_blank">📸 Instagram</a> ';
  if(s.fb) h+='<a class="socialLink" style="background:#1877F2" href="'+s.fb+'" target="_blank">📘 Facebook</a> ';
  if(s.sp) h+='<a class="socialLink" style="background:#1DB954" href="'+s.sp+'" target="_blank">🎧 Spotify</a> ';
  return h || '<span class="small">No social links added yet - Add them in Profile</span>';
}
function go(id){ var p=document.querySelectorAll('.page'); for(var i=0;i<p.length;i++) p[i].classList.remove('show'); var pg=document.getElementById('page-'+id); if(pg) pg.classList.add('show'); var b=document.querySelectorAll('.bottomnav button'); for(var j=0;j<b.length;j++) b[j].classList.remove('on'); var btn=document.getElementById('btn-'+id); if(btn) btn.classList.add('on'); window.scrollTo(0,0); if(id=='mysongs') showMy(); if(id=='admin') showAdmin(); if(id=='earnings') showEarn(); if(id=='chat') showChat(); }
function openPicPicker(){ document.getElementById('artistPicFile').click(); }
function pickPic(el){ var f=el.files[0]; if(!f) return; pic=URL.createObjectURL(f); document.getElementById('myPic').src=pic; document.getElementById('picMsg').innerHTML='✅ Photo chosen: '+f.name; }
function saveArtistProfile(){
  var name=document.getElementById('aName').value.trim()||'Your Name';
  var country=document.getElementById('aCountry').value;
  var city=document.getElementById('aCity').value.trim()||'Your City';
  document.getElementById('showArtistName').innerHTML=name;
  document.getElementById('showArtistInfo').innerHTML=city+', '+country;
  var s=getSocials();
  document.getElementById('showSocials').innerHTML=socialHTML(s);
  document.getElementById('profSaveMsg').innerHTML='✅ PROFILE + SOCIALS SAVED! Your songs will now auto-link to these!';
  alert('✅ Profile + Socials Saved!\n\nYour songs will now AUTOMATICALLY link to:\nYouTube: '+(s.yt||'Not added')+'\nTikTok: '+(s.tt||'Not added')+'\nInstagram: '+(s.ig||'Not added'));
}
function pickCover(el){ var f=el.files[0]; if(!f) return; cover=URL.createObjectURL(f); var img=document.getElementById('coverPrev'); img.src=cover; img.style.display='block'; }
function pickAudio(el){ var f=el.files[0]; if(!f) return; audio=URL.createObjectURL(f); audioName=f.name; document.getElementById('audioMsg').innerHTML='✅ MP3 OK: '+f.name; var t=document.getElementById('t'); if(t && !t.value) t.value=f.name.replace('.mp3',''); }
function submitSong(){
  var name=document.getElementById('aName').value.trim()||'Unknown Artist';
  var wa=document.getElementById('aWa').value.trim()||'';
  var country=document.getElementById('aCountry').value;
  var city=document.getElementById('aCity').value.trim()||'';
  var momo=document.getElementById('aMomo').value.trim()||wa;
  var t=document.getElementById('t').value.trim()||audioName||'Untitled';
  var g=document.getElementById('g').value;
  var s=getSocials();
  if(!audio){ alert('❌ Choose MP3 first'); return; }
  var song={title:t,artist:name,genre:g,cover:cover||'https://via.placeholder.com/150',audio:audio,wa:wa,momo:momo,country:country,city:city,pic:pic,status:'PENDING',socials:s,auto:true,submitted:new Date().toLocaleString(),reason:''};
  subs.unshift(song);
  var msg='🎤 NEW SUBMISSION - AUTO DISTRIBUTION\nArtist: '+name+'\nSong: '+t+'\nGenre: '+g+'\nWhatsApp: '+wa+'\nMoMo: '+momo+'\n\nARTIST SOCIALS:\n▶️ YouTube: '+(s.yt||'Not added')+'\n🎵 TikTok: '+(s.tt||'Not added')+'\n📸 Instagram: '+(s.ig||'Not added')+'\n📘 Facebook: '+(s.fb||'Not added')+'\n🎧 Spotify: '+(s.sp||'Not added')+'\n\nPlease approve - song will auto-link to artist socials!';
  window.open('https://wa.me/256705570948?text='+encodeURIComponent(msg),'_blank');
  alert('✅ SUBMITTED! AUTO DISTRIBUTION ON\n\nYour song will automatically link to your YouTube, TikTok, Instagram, Facebook after approval!');
  go('mysongs');
}
function showMy(){
  var h='';
  for(var i=0;i<subs.length;i++){
    var s=subs[i];
    var badge=s.status=='PENDING'?'<span class="badge pend">⏳ PENDING</span>':s.status=='APPROVED'?'<span class="badge appr">✅ APPROVED</span>':'<span class="badge reje">❌ REJECTED</span>';
    var dist = s.status=='APPROVED' ? '<p><span class="autoBadge">🤖 AUTO-POSTED</span></p><p style="font-size:13px">✅ Vixxon ✅ YouTube ✅ TikTok<br>Follow artist here:</p>' : '<p style="color:#FFC107;font-size:13px">🤖 AUTO-DISTRIBUTION ON<br>Will auto-link to your socials after approval</p>';
    h+='<div class="card"><b>'+s.title+'</b> - '+s.artist+'<br>'+badge+'<br>'+dist+socialHTML(s.socials||{})+'<br><br><button class="btn btnP" onclick="promoteSong(\''+s.title.replace(/'/g,'')+'\')">🚀 PROMOTE THIS SONG - 5,000 / MONTH</button></div>';
  }
  document.getElementById('myList').innerHTML=h||'<p>No songs yet. Go to Upload to add your first song.</p>';
}
function showAdmin(){
  var h='';
  for(var i=0;i<subs.length;i++){
    var s=subs[i];
    h+='<div class="card"><b>'+s.title+'</b> - '+s.artist+'<br>WhatsApp: '+s.wa+' | MoMo: '+s.momo+'<br>Status: <b>'+s.status+'</b><br><b>Artist Socials:</b><br>'+socialHTML(s.socials||{})+'<br><br><button class="btn btnG" onclick="approve('+i+')">✅ APPROVE + AUTO-POST</button><button class="btn btnR" onclick="reject('+i+')">❌ REJECT</button><button class="btn btnB" onclick="listenSong('+i+')">▶ LISTEN</button><br><b style="color:#FFC107">🤖 AUTO-DISTRIBUTION:</b><br><button class="btn ytBtn" onclick="postToYouTube('+i+')">▶️ AUTO-POST TO YOUTUBE</button><button class="btn ttBtn" onclick="postToTikTok('+i+')">🎵 AUTO-POST TO TIKTOK</button><button class="btn" style="background:#E1306C" onclick="postToInstagram('+i+')">📸 AUTO-POST TO INSTAGRAM</button><button class="btn btnWA" onclick="shareToWhatsApp('+i+')">💚 SHARE TO WHATSAPP STATUS</button></div>';
  }
  document.getElementById('adminList').innerHTML=h||'<p>No submissions yet.</p>';
}
function approve(i){ subs[i].status='APPROVED'; alert('✅ APPROVED + AUTO-DISTRIBUTION ON!\n\nSong now links to artist YouTube, TikTok, Instagram, Facebook automatically!\n\nNow tap AUTO-POST buttons below to post it!'); showAdmin(); showMy(); showEarn(); }
function reject(i){ var r=prompt('Why reject?'); if(r===null) return; subs[i].status='REJECTED'; subs[i].reason=r; showAdmin(); showMy(); }
function listenSong(i){ var s=subs[i]; document.getElementById('adminPlayer').style.display='block'; document.getElementById('adminAudio').src=s.audio; document.getElementById('adminAudio').play(); earn.streams++; showEarn(); }
function openAdmin(){ var pw=prompt('Admin Password:'); if(pw=='vixxon123'){ go('admin'); showAdmin(); } else if(pw!==null){ alert('Wrong password'); } }
function postToYouTube(i){
  var s=subs[i];
  var title=s.title+' - '+s.artist+' | Vixxon Official 🇺🇬';
  var desc='🔥 '+s.title+' by '+s.artist+'\n\nListen on Vixxon: https://vixxonofficial256.github.io/wicky-ai/\n\nFOLLOW '+s.artist.toUpperCase()+':\n▶️ YouTube: '+(s.socials.yt||'')+'\n🎵 TikTok: '+(s.socials.tt||'')+'\n📸 Instagram: '+(s.socials.ig||'')+'\n📘 Facebook: '+(s.socials.fb||'')+'\n\n#Vixxon #'+s.artist.replace(/ /g,'')+' #UgandaMusic #NewMusic #'+s.genre;
  window.open('https://www.youtube.com/upload','_blank');
  setTimeout(function(){ alert('🤖 AUTO YOUTUBE POST\n\nCOPY TITLE:\n'+title+'\n\nCOPY DESCRIPTION:\n'+desc); },500);
}
function postToTikTok(i){
  var s=subs[i];
  var caption='🔥 '+s.title+' by '+s.artist+' 🎤 #Vixxon #UgandaMusic #NewMusic #'+s.genre+' #fyp #viral\nFollow: '+(s.socials.tt||'');
  window.open('https://www.tiktok.com/upload','_blank');
  setTimeout(function(){ alert('🤖 AUTO TIKTOK POST\n\nCOPY CAPTION:\n\n'+caption); },500);
}
function postToInstagram(i){
  var s=subs[i];
  var caption='🔥 NEW MUSIC 🔥\n'+s.title+' by '+s.artist+'\n\nListen on Vixxon 👉 Link in bio\nFollow artist: '+(s.socials.ig||'')+'\n\n#Vixxon #UgandaMusic #'+s.genre;
  window.open('https://www.instagram.com/','_blank');
  setTimeout(function(){ alert('🤖 AUTO INSTAGRAM POST\n\nCOPY CAPTION:\n\n'+caption); },500);
}
function shareToWhatsApp(i){
  var s=subs[i];
  var msg='🔥 NEW MUSIC ON VIXXON!\n\n🎵 '+s.title+' by '+s.artist+'\n\nFollow artist:\n▶️ '+(s.socials.yt||'')+'\n🎵 '+(s.socials.tt||'')+'\n📸 '+(s.socials.ig||'')+'\n\nListen on Vixxon 👉 https://vixxonofficial256.github.io/wicky-ai/\n#Vixxon #UgandaMusic';
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}
function promoteSong(title){ var name=document.getElementById('aName').value.trim()||'Artist'; var d=new Date(Date.now()+30*24*60*60*1000); earn.promoUntil=d.toLocaleDateString(); earn.promoSong=title; var msg='🚀 PROMOTION REQUEST - 1 MONTH\n\nArtist: '+name+'\nSong: '+title+'\nPrice: UGX 5,000 for 30 days'; window.open('https://wa.me/256705570948?text='+encodeURIComponent(msg),'_blank'); alert('🚀 PROMOTION REQUESTED!'); showEarn(); }
function requestBooking(){ var name=document.getElementById('aName').value.trim()||'Artist'; var type=prompt('What event? Wedding / Church / Club / Birthday?'); if(!type) return; var date=prompt('What date is the show?'); if(!date) return; var price=prompt('Your booking price? e.g. 200000'); if(!price) return; price=parseInt(price); var artistShare=Math.round(price*0.9); earn.bookings++; earn.bookingList.unshift({event:type,date:date,price:price,artist:artistShare,vixxon:Math.round(price*0.1)}); var msg='📞 BOOKING REQUEST\n\nArtist: '+name+'\nEvent: '+type+'\nDate: '+date+'\nPrice: UGX '+price+'\nArtist Gets (90%): UGX '+artistShare; window.open('https://wa.me/256705570948?text='+encodeURIComponent(msg),'_blank'); alert('📞 BOOKING ADDED! You get 90%: '+artistShare); showEarn(); }
function requestShoutout(){ var name=document.getElementById('aName').value.trim()||'Artist'; var forWho=prompt('Shoutout for who? e.g. Happy Birthday Sarah'); if(!forWho) return; earn.shoutouts++; earn.shoutList.unshift({for:forWho,artist:4500,vixxon:500}); var msg='🎤 SHOUTOUT REQUEST - UGX 5,000\n\nArtist: '+name+'\nMessage: '+forWho; window.open('https://wa.me/256705570948?text='+encodeURIComponent(msg),'_blank'); alert('🎤 SHOUTOUT ADDED! You get 4,500 (90%)'); showEarn(); }
function joinVIP(){ var name=document.getElementById('aName').value.trim()||'Artist'; var fan=prompt('Fan name for VIP? e.g. Sarah'); if(!fan) fan='Fan'; earn.vip++; earn.vipList.unshift({fan:fan,artist:1500,vixxon:500}); var msg='⭐ VIP FAN CLUB JOIN - UGX 2,000 / MONTH\n\nArtist: '+name+'\nFan: '+fan; window.open('https://wa.me/256705570948?text='+encodeURIComponent(msg),'_blank'); alert('⭐ VIP ADDED! You get 1,500 (75%) every month'); showEarn(); }
function voteArtist(){ var name=document.getElementById('aName').value.trim()||'Artist'; var votes=prompt('How many votes? 1 vote = UGX 100. e.g. type 10 for 10 votes = 1,000'); if(!votes) return; votes=parseInt(votes); var total=votes*100; earn.votes+=votes; earn.voteList.unshift({votes:votes,total:total}); var msg='🗳️ VOTE FOR '+name+'\n\nVotes: '+votes+'\nTotal Paid: UGX '+total; window.open('https://wa.me/256705570948?text='+encodeURIComponent(msg),'_blank'); alert('🗳️ '+votes+' VOTES ADDED! Total: UGX '+total); showEarn(); }
function fakeDownload(title){ earn.downloads++; earn.per[title]=(earn.per[title]||0)+1; alert('💳 Fan paid UGX 100 MoMo! Artist gets 50'); showEarn(); }
function getTotals(){ var dlMoney=earn.downloads*50; var shoutMoney=earn.shoutouts*4500; var vipMoney=earn.vip*1500; var voteMoney=Math.round(earn.votes*100*0.5); var bookMoney=0; for(var i=0;i<earn.bookingList.length;i++) bookMoney+=earn.bookingList[i].artist; var totalArtist=dlMoney+shoutMoney+vipMoney+voteMoney+bookMoney; var vixxonDl=earn.downloads*50; var vixxonShout=earn.shoutouts*500; var vixxonVip=earn.vip*500; var vixxonVote=Math.round(earn.votes*100*0.5); var vixxonBook=0; for(var j=0;j<earn.bookingList.length;j++) vixxonBook+=earn.bookingList[j].vixxon; var totalVixxon=vixxonDl+vixxonShout+vixxonVip+vixxonVote+vixxonBook; return {dl:dlMoney,shout:shoutMoney,vip:vipMoney,vote:voteMoney,book:bookMoney,total:totalArtist,vixxon:totalVixxon}; }
function showEarn(){
  var t=getTotals();
  var approved=subs.filter(function(x){return x.status=='APPROVED'});
  var h=''; for(var i=0;i<approved.length;i++){ var s=approved[i]; var dl=earn.per[s.title]||0; h+='<div class="card"><b>'+s.title+'</b><br>Downloads: '+dl+' | You earned: UGX '+(dl*50)+'<br><button class="btn btnG" onclick="fakeDownload(\''+s.title.replace(/'/g,'')+'\')">💳 Simulate Fan Paid 100 (Test)</button></div>'; }
  document.getElementById('earnList').innerHTML=h||'<p>No approved songs yet.</p>';
  document.getElementById('earnTotal').innerHTML='Total Balance: UGX '+t.total.toLocaleString();
  document.getElementById('earnBreak').innerHTML='⬇ Downloads: '+earn.downloads+' x 50 = UGX '+t.dl+'<br>🎤 Shoutouts: '+earn.shoutouts+' x 4,500 = UGX '+t.shout+'<br>⭐ VIP Fans: '+earn.vip+' x 1,500 = UGX '+t.vip+'<br>🗳️ Votes: '+earn.votes+' votes = Your 50% = UGX '+t.vote+'<br>📞 Bookings: '+earn.bookings+' = Your 90% = UGX '+t.book+'<br>🚀 Promotion: '+(earn.promoUntil?'ACTIVE - '+earn.promoSong+' until '+earn.promoUntil:'Not active')+'<br><br><b>Vixxon Share: UGX '+t.vixxon.toLocaleString()+'</b>';
  document.getElementById('profileEarnBalance').innerHTML='Balance: UGX '+t.total.toLocaleString();
  document.getElementById('voteCount').innerHTML=earn.votes+' Votes';
  document.getElementById('vipCount').innerHTML=earn.vip+' VIP Fans';
  document.getElementById('shoutCount').innerHTML=earn.shoutouts+' Shoutouts';
  document.getElementById('promoStruct').innerHTML = earn.promoUntil ? '✅ <b>ACTIVE</b><br>Song: '+earn.promoSong+'<br>Until: '+earn.promoUntil : '❌ Not Active';
  var bh=''; for(var b=0;b<earn.bookingList.length;b++){ var bk=earn.bookingList[b]; bh+='• '+bk.event+' - '+bk.date+' - Price '+bk.price+' → You: '+bk.artist+' | Vixxon: '+bk.vixxon+'<br>'; }
  document.getElementById('bookingStruct').innerHTML = bh || 'No bookings yet.';
  document.getElementById('bookingTotal').innerHTML = 'Your Booking Earnings: UGX '+t.book.toLocaleString()+' ('+earn.bookings+' bookings)';
  var sh=''; for(var s2=0;s2<earn.shoutList.length;s2++){ var sl=earn.shoutList[s2]; sh+='• '+sl.for+' → You: 4,500 | Vixxon: 500<br>'; }
  document.getElementById('shoutStruct').innerHTML = sh || 'No shoutouts yet.';
  document.getElementById('shoutTotal').innerHTML = 'Your Shoutout Earnings: UGX '+t.shout.toLocaleString();
  var vh=''; for(var v=0;v<earn.vipList.length;v++){ var vl=earn.vipList[v]; vh+='• '+vl.fan+' → You: 1,500 / month | Vixxon: 500 / month<br>'; }
  document.getElementById('vipStruct').innerHTML = vh || 'No VIP fans yet.';
  document.getElementById('vipTotal').innerHTML = 'Your VIP Earnings: UGX '+t.vip.toLocaleString()+' / month ('+earn.vip+' fans)';
  var voh=''; for(var vo=0;vo<earn.voteList.length;vo++){ var vv=earn.voteList[vo]; voh+='• '+vv.votes+' votes = UGX '+vv.total+' paid<br>'; }
  document.getElementById('voteStruct').innerHTML = voh || 'No votes yet.';
  document.getElementById('voteTotal').innerHTML = 'Your Votes: '+earn.votes+' | Your 50% Prize if you win: UGX '+t.vote.toLocaleString();
}
function requestPayout(){
  var name=document.getElementById('aName').value.trim()||'Artist'; var momo=document.getElementById('aMomo').value||'';
  var t=getTotals();
  if(t.total<1000){ alert('❌ Need at least UGX 1,000 to request payout.\nYou have UGX '+t.total); return; }
  var msg='💸 VIXXON WEEKLY PAYOUT\n\nArtist: '+name+'\nTotal: UGX '+t.total+'\nMoMo: '+momo;
  window.open('https://wa.me/256705570948?text='+encodeURIComponent(msg),'_blank'); alert('✅ PAYOUT REQUESTED: UGX '+t.total); showEarn();
}
